<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>パターン判定ドリル｜解法の地図</title>
<link rel="stylesheet" href="assets/katex/katex.min.css">
<link rel="stylesheet" href="assets/style.css">
<script defer src="assets/katex/katex.min.js"></script>
<script defer src="assets/katex/auto-render.min.js"></script>
<script defer src="assets/data/patterns.js"></script>
<script defer src="assets/data/drill.js"></script>
<script defer src="assets/site.js"></script>
</head>
<body data-root="">
<main>
<header class="unit-head">
  <h1>パターン判定ドリル</h1>
  <p class="lead">単元名を隠した類題が出題されます。試験本番と同じように、<b>問題文だけを見て「どのパターンで解くか」を判断する</b>練習です。① パターンを選ぶ → ② 方針を確認して紙に解く → ③ 答え合わせと自己判定、の順に進みます。</p>
</header>
<div id="drill-app">
  <form class="drill-settings" onsubmit="return false">
    <fieldset><legend>出題のしかた</legend>
      <label><input type="radio" name="mode" value="all" checked> すべてから</label>
      <label><input type="radio" name="mode" value="todo"> 未習得のパターンから</label>
      <label><input type="radio" name="mode" value="due"> 今日の復習から</label>
    </fieldset>
    <fieldset><legend>科目</legend>
      <label><input type="checkbox" name="subj" value="数学I" checked> 数学I</label>
      <label><input type="checkbox" name="subj" value="数学A" checked> 数学A</label>
      <label><input type="checkbox" name="subj" value="数学II" checked> 数学II</label>
      <label><input type="checkbox" name="subj" value="数学B" checked> 数学B</label>
      <label><input type="checkbox" name="subj" value="数学C" checked> 数学C</label>
      <label><input type="checkbox" name="subj" value="数学III" checked> 数学III</label>
    </fieldset>
    <fieldset><legend>難易度</legend>
      <label><input type="checkbox" name="lv" value="1" checked> 基礎</label>
      <label><input type="checkbox" name="lv" value="2" checked> 標準</label>
      <label><input type="checkbox" name="lv" value="3"> 阪大</label>
    </fieldset>
    <fieldset><legend>問題数</legend>
      <label><select name="count"><option>5</option><option selected>10</option><option>20</option></select></label>
    </fieldset>
    <p><button type="button" class="btn primary" data-act="start">出題する</button><span class="pool-count"></span></p>
  </form>
  <div class="drill-stage"></div>
</div>
</main>
<footer class="site-footer">解法の地図 — 高校数学 解法パターン対応表</footer>
</body>
</html>
